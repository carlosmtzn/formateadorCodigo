<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formateador de Código</title>
    <!-- Estilos de la aplicación -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Formateador de Código</h1>
    </header>

    <div class="controls">
        <label for="languageSelect">Tipo de código:</label>
        <select id="languageSelect">
            <option value="xml">XML</option>
            <option value="json">JSON</option>
            <option value="html">HTML / JSP</option>
            <option value="java">Java</option>
            <option value="javascript">JavaScript</option>
        </select>
        <button id="formatBtn">Formatear</button>
        <button id="minifyBtn" class="btn-secondary">Minificar</button>
        <button id="validBtn" class="btn-secondary">Validar</button>
        <button id="statsBtn" class="btn-secondary">Estadísticas</button>
        <button id="downloadBtn" class="btn-secondary">Descargar</button>
        <button id="copyBtn">Copiar resultado</button>
        <button id="clearBtn" class="btn-secondary">Limpiar</button>
        <button id="themeToggleBtn" type="button">🌙 Modo Oscuro</button>
    </div>

    <div class="container">
        <!-- Panel Izquierdo: Entrada -->
        <div class="panel">
            <div class="panel-header">
                <span>Código sin formato</span>
                <span style="font-size: 0.78rem; opacity: 0.75;">(Ctrl + Enter para formatear)</span>
            </div>
            <div class="panel-body">
                <textarea id="input" placeholder="Pegue aquí el código a formatear..."></textarea>
            </div>
        </div>

        <!-- Panel Derecho: Salida con Resaltado IDE -->
        <div class="panel">
            <div class="panel-header">
                <span>Código formateado</span>
                <span style="font-size: 0.78rem; opacity: 0.75;">Resaltado de sintaxis</span>
            </div>
            <div class="panel-body code-viewer-container" id="outputContainer">
                <div id="outputPlaceholder" class="empty-placeholder">El código formateado aparecerá aquí con colores tipo IDE...</div>
                <pre><code id="outputCode" style="display: none;"></code></pre>
            </div>
        </div>
    </div>

    <div class="status" id="status">Listo</div>

    <!-- Modal de Estadísticas -->
    <div id="statsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Estadísticas del Código</div>
            <div class="modal-stats" id="statsContent"></div>
            <button id="modalCloseBtn" class="modal-close">Cerrar</button>
        </div>
    </div>

    <!-- Prism.js (Syntax Highlighting ligero vía CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>

    <!-- Scripts de la aplicación -->
    <script src="js/formatters.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
